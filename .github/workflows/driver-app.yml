name: Driver app builds

# Asks Expo's build service (EAS) for a build of the driver app. The build itself runs on Expo's servers
# (no Xcode or Android Studio needed); this job only needs the repo, Node and the EAS CLI.
#
#   Run workflow             → the profile and platform you pick (preview by default)
#   push of a driver-v* tag  → a production build for both platforms
#
# Settings (Settings → Secrets and variables → Actions, at repository level):
#   secret    EXPO_TOKEN             an Expo access token that may build this project
#   variable  DRIVER_EAS_PROJECT_ID  the driver app's EAS project id, as printed by `eas init`. The
#                                    shopping app is a separate Expo project with its own id.
# Keep the same id on expo.dev as the project's EAS_PROJECT_ID environment variable: Expo's build server
# evaluates app.config.ts again, and the app reads the id from there to register for push notifications.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [all, android, ios]
        default: all
  push:
    tags: ['driver-v*']

permissions:
  contents: read

jobs:
  build:
    name: Start EAS build
    # A fork has no Expo token. Skip there instead of failing on every tag.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a job that holds a token: a cache is something an earlier run could have
      # tampered with, and this job runs too rarely to miss it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The EAS CLI evaluates app.config.ts on this runner. That needs the app's packages, but none of
      # their install scripts (see ci.yml).
      - run: npm ci --ignore-scripts
      # `latest` is what Expo recommends, because the CLI changes together with the build service;
      # eas.json names the oldest CLI the project accepts. The action only installs the CLI. The token
      # goes to the build step alone.
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          eas-cache: false
          packager: npm
      - name: Start EAS build
        working-directory: apps/driver
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # app.config.ts takes extra.eas.projectId from EAS_PROJECT_ID and from nowhere else. Without it
          # the CLI cannot tell which Expo project this is and stops with "EAS project not configured".
          # The copy kept on expo.dev cannot help here: the CLI only fetches those variables once it
          # knows the project.
          EAS_PROJECT_ID: ${{ vars.DRIVER_EAS_PROJECT_ID }}
          PROFILE: ${{ inputs.profile || 'production' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN is not set::Add an Expo access token as the secret EXPO_TOKEN (expo.dev, Account settings, Access tokens)."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error title=DRIVER_EAS_PROJECT_ID is not set::Add the driver app's EAS project id as the variable DRIVER_EAS_PROJECT_ID. 'eas init' prints it and the project's page on expo.dev shows it. Use the driver app's id, not the shopping app's."
            exit 1
          fi
          eas build --non-interactive --no-wait --profile "$PROFILE" --platform "$PLATFORM"
